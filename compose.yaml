services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - estoque_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d estoque"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  estoque_data:
